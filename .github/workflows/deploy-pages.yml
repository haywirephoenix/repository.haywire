name: Deploy Kodi Repository with Directory Listings

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Each add-on's publish pushes here, and they often land together: a Pages deployment can't
# start while another is in progress (it fails with 400). One at a time instead; a waiting run
# is replaced by a newer one, which deploys main as it is by then (everything pushed before).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-directory-listing:
    runs-on: ubuntu-latest
    name: Directory Listings Index
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Kodi-compatible directory listings
        run: python3 tools/generate_kodi_index.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "zips"

  deploy:
    needs: pages-directory-listing
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0
